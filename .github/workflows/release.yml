# Package Infiniti TV Home for legacy LG webOS 3.4.0 (Chromium 38).
name: Build Infiniti TV Home
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Create version tag and publish the verified IPK to GitHub Releases'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate app metadata
        shell: bash
        run: |
          node -e "const a=require('./app/appinfo.json');if(a.id!=='com.infinitimoney.tvhome'||a.title!=='Infiniti TV Home')process.exit(1);console.log(a.id, a.version)"

      - name: Check ES5 compatibility, Home rollback, and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-webos3.js
          node scripts/check-branding.js
          node scripts/test-homewatch.js
          node scripts/test-keymap.js
          node scripts/test-ai-worker.mjs
          node scripts/test-assistant.js
          node scripts/test-lunar.js
          node scripts/test-forecast.js
          node scripts/test-customize.js
          node scripts/test-app-structure.js
          node scripts/test-settings-ui.js
          node scripts/test-weather-ui.js
          node scripts/test-tv-layout.js
          for file in app/app.js app/extras.js app/config.js app/assistant.js app/customize.js app/lunar.js app/forecast.js app/qrcode.js tv/*.js; do node --check "$file"; done
          for file in install.sh tv/*.sh; do sh -n "$file"; done
          for file in home-watch-mac.sh install-noroot.sh; do bash -n "$file"; done
          python3 -m py_compile home-watch.py sync-apps.py lgtv.py

      - name: Package without modern-JS minification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          npx -y -p @webos-tools/cli@3.2.6 ares-package --no-minify app -o build
          shopt -s nullglob
          files=(build/com.infinitimoney.tvhome_*.ipk)
          test "${#files[@]}" -eq 1
          cp "${files[0]}" build/infiniti-tv-home.ipk
          ar t build/infiniti-tv-home.ipk | grep -qx 'debian-binary'
          ar t build/infiniti-tv-home.ipk | grep -q '^data.tar'
          (cd build && sha256sum infiniti-tv-home.ipk > infiniti-tv-home.ipk.sha256)
          ls -lh build

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: infiniti-tv-home-ipk
          path: |
            build/infiniti-tv-home.ipk
            build/infiniti-tv-home.ipk.sha256
          if-no-files-found: error
          retention-days: 30

      # Release v1.5.0 once from the deliberate main merge commit with the
      # exact prefix below. All checks, packaging and artifact upload run first.
      # Manual workflow_dispatch publishing is retained as the fallback.
      # Future ordinary main pushes cannot trigger the release gate.
      - name: Create verified version tag
        if: >-
          ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_release) ||
              (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
               startsWith(github.event.head_commit.message, 'release: publish verified v1.5.0')) }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo 'ERROR: Only main can be released'; exit 1; }
          VERSION=$(node -p "require('./app/appinfo.json').version")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'ERROR: Invalid app version'; exit 1; }
          if [ "${{ github.event_name }}" = "push" ]; then
            test "$VERSION" = "1.5.0" || { echo 'ERROR: One-shot publish only permits v1.5.0'; exit 1; }
          fi
          TAG="v$VERSION"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          existing=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk '{print $1}')
          if [ -z "$existing" ]; then
            existing=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')
          fi
          if [ -n "$existing" ]; then
            test "$existing" = "$GITHUB_SHA" || { echo "ERROR: $TAG points to another commit: $existing"; exit 1; }
            echo "Existing $TAG points to this commit; retrying release upload"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish tagged release
        if: >-
          ${{ startsWith(github.ref, 'refs/tags/v') ||
              (github.event_name == 'workflow_dispatch' && inputs.publish_release) ||
              (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
               startsWith(github.event.head_commit.message, 'release: publish verified v1.5.0')) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG || github.ref_name }}
          files: |
            build/infiniti-tv-home.ipk
            build/infiniti-tv-home.ipk.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
