# Package Designed by Tân Dev for legacy LG webOS 3.4.0 (Chromium 38).
name: Build Designed by Tân Dev
on:
  push:
    # Test feature branches even when pull_request events from app-authored
    # changes are not automatically scheduled by GitHub.
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Explicitly publish a v1.6.3 hardware-unverified prerelease'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate app metadata
        shell: bash
        run: |
          node -e "const a=require('./app/appinfo.json');if(a.id!=='com.infinitimoney.tvhome'||a.title!=='Designed by Tân Dev'||a.vendor!=='Designed by Tân Dev')process.exit(1);console.log(a.id, a.version)"

      - name: Check ES5 compatibility, Home rollback, and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-webos3.js
          node scripts/test-glasshouse-lifecycle.js
          python3 scripts/test-tv-service-wake.py
          python3 scripts/test-legacy-home-v8.py
          node scripts/test-legacy-luna.js
          node scripts/test-legacy-v84.js
          node scripts/test-legacy-v85.js
          node scripts/check-branding.js
          node scripts/test-homewatch.js
          node scripts/test-homekey-runtime.js
          node scripts/test-home-cold-boot.js
          node scripts/test-black-screen-recovery.js
          node scripts/test-auto-update.js
          node scripts/test-homeevent.js
          node scripts/test-app-discovery.js
          node scripts/test-keymap.js


          node scripts/test-lunar.js
          node scripts/test-forecast.js
          node scripts/test-customize.js
          node scripts/test-remote-settings.js
          node scripts/test-idle-album.js
          node scripts/test-idle-effect.js
          node scripts/test-wallpaper-key.js
          node scripts/test-local-name.js
          node scripts/test-lan-integration.js
          node scripts/test-app-structure.js
          node scripts/test-glasshouse.js
          node scripts/test-settings-ui.js
          node scripts/test-privacy-apps.js

          node scripts/test-homebrew-failsafe.js
          node scripts/test-autostart-rollback.js
          node scripts/test-upstream-compat.js
          python3 scripts/test-sync-noroot.py
          node scripts/test-weather-ui.js
          node scripts/test-tv-layout.js
          for file in app/app.js app/glasshouse.js app/lifecycle.js app/extras.js app/config.js app/customize.js app/lunar.js app/forecast.js app/qrcode.js tv/*.js; do node --check "$file"; done
          for file in install.sh tv/*.sh; do sh -n "$file"; done
          for file in home-watch-mac.sh install-noroot.sh; do bash -n "$file"; done
          # PowerShell syntax check when pwsh is available on the GitHub runner.
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command '$errors = $null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/recover-lg-tv.ps1", [ref]$null, [ref]$errors) | Out-Null; if ($errors.Count) { $errors | Format-List; exit 1 }'
          fi
          python3 -m py_compile home-watch.py sync-apps.py lgtv.py scripts/tv-service-wake.py tv/legacy-home-v8.py

      - name: Package without modern-JS minification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          npx -y -p @webos-tools/cli@3.2.6 ares-package --no-minify app -o build
          shopt -s nullglob
          files=(build/com.infinitimoney.tvhome_*.ipk)
          test "${#files[@]}" -eq 1
          cp "${files[0]}" build/infiniti-tv-home.ipk
          ar t build/infiniti-tv-home.ipk | grep -qx 'debian-binary'
          ar t build/infiniti-tv-home.ipk | grep -q '^data.tar'
          (cd build && sha256sum infiniti-tv-home.ipk > infiniti-tv-home.ipk.sha256)
          ls -lh build

      - name: Bundle recovery scripts and rooted sidecars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/infiniti-root-tools/tv build/infiniti-root-tools/scripts
          git ls-files -z tv/ | xargs -0 -I {} cp -- "{}" build/infiniti-root-tools/tv/
          cp scripts/recover-lg-tv.ps1 scripts/tv-service-wake.py build/infiniti-root-tools/scripts/
          cp lgtv.py build/infiniti-root-tools/
          cp install.sh README.vi.md RELEASE_NOTES_v1.6.3.md docs/legacy-home-v8.vi.md docs/owner-guide.vi.md docs/release-spec-v1.6.3.vi.md build/infiniti-root-tools/
          (cd build && zip -qr infiniti-tv-home-root-tools-v1.6.3.zip infiniti-root-tools)
          (cd build && sha256sum infiniti-tv-home-root-tools-v1.6.3.zip > infiniti-tv-home-root-tools-v1.6.3.zip.sha256)
          unzip -l build/infiniti-tv-home-root-tools-v1.6.3.zip | grep -q 'tv/safe-recovery.sh'
          unzip -l build/infiniti-tv-home-root-tools-v1.6.3.zip | grep -q 'scripts/recover-lg-tv.ps1'
          unzip -l build/infiniti-tv-home-root-tools-v1.6.3.zip | grep -q 'scripts/tv-service-wake.py'
          unzip -l build/infiniti-tv-home-root-tools-v1.6.3.zip | grep -q 'lgtv.py'

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: infiniti-tv-home-ipk
          path: |
            build/infiniti-tv-home.ipk
            build/infiniti-tv-home.ipk.sha256

            build/infiniti-tv-home-root-tools-v1.6.3.zip
            build/infiniti-tv-home-root-tools-v1.6.3.zip.sha256
          if-no-files-found: error
          retention-days: 30

      # Candidate publication requires explicit dispatch on main; no automatic tag or merge publish.
      - name: Create candidate version tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo 'ERROR: Only main can be released'; exit 1; }
          VERSION=$(node -p "require('./app/appinfo.json').version")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'ERROR: Invalid app version'; exit 1; }
          test "$VERSION" = "1.6.3" || { echo 'ERROR: Candidate requires v1.6.3'; exit 1; }
          TAG="v$VERSION"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          existing=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk '{print $1}')
          if [ -z "$existing" ]; then
            existing=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')
          fi
          if [ -n "$existing" ]; then
            test "$existing" = "$GITHUB_SHA" || { echo "ERROR: $TAG points to another commit: $existing"; exit 1; }
            echo "Existing $TAG points to this commit; retrying release upload"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish candidate release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG || github.ref_name }}
          name: Designed by Tân Dev ${{ env.RELEASE_TAG || github.ref_name }}
          prerelease: true
          make_latest: false
          files: |
            build/infiniti-tv-home.ipk
            build/infiniti-tv-home.ipk.sha256

            build/infiniti-tv-home-root-tools-v1.6.3.zip
            build/infiniti-tv-home-root-tools-v1.6.3.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: RELEASE_NOTES_v1.6.3.md
